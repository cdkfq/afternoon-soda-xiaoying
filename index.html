<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081629">
  <meta name="description" content="给小颖的一场冬夜。雪慢慢落，歌慢慢放，点一下天空，就有烟花。">
  <title>雪落，烟花起 · 给小颖</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./fonts/winter-title.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/winter-letter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles.css?v=20261121-winter1">
  <script type="importmap">{"imports":{"winter/config":"./js/config.js?v=20261121-winter1","winter/audio":"./js/audio.js?v=20261121-winter1","winter/landscape":"./js/landscape.js?v=20261121-winter1","winter/fireworks":"./js/fireworks.js?v=20261121-winter1"}}</script>
</head>
<body>
  <main id="night" aria-label="冬天的雪夜，可以听歌、放烟花、看一封小纸条">
    <canvas id="landscape" aria-hidden="true"></canvas>
    <canvas id="fireworks" aria-hidden="true"></canvas>
    <canvas id="weather" aria-hidden="true"></canvas>
    <div class="film-shade" aria-hidden="true"></div>
    <div id="sky-touch" role="button" tabindex="0" aria-label="轻点天空放烟花，长按后松手放更大的烟花，键盘按空格也可以"></div>
    <div class="load-curtain" id="loading" role="status"><span class="tiny-spark" aria-hidden="true">✧</span><span>夜色，慢慢亮起。</span></div>
    <header class="letter-heading">
      <p class="dedication"><span aria-hidden="true"></span> 给小颖的一场冬夜</p>
      <h1>借一晚雪，<br>看一场烟花。</h1>
      <p class="opening-line">这首歌，适合慢慢听。</p>
    </header>
    <div class="audio-controls" aria-label="音乐与声音">
      <button id="music-toggle" type="button" aria-label="播放冯提莫的 What Are Words" aria-pressed="false"><span class="music-bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="music-label">听首歌</span></button>
      <button id="sound-toggle" type="button" class="round-button" aria-label="关闭声音" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound-wave" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="sound-slash" d="m4 3 16 18"/></svg></button>
    </div>
    <button id="lamp-toggle" class="scene-hit" type="button" aria-label="调暗湖岸的路灯" aria-pressed="true"><span class="object-hint">把灯留亮一点</span></button>
    <button id="note-open" class="scene-hit" type="button" aria-label="看看长椅上的小纸条"><span class="note-mark" aria-hidden="true">✧</span><span class="object-hint">一张纸条</span></button>
    <footer class="night-footer">
      <div class="quiet-caption"><p id="caption" aria-live="polite">雪慢慢落，我们慢慢看。</p><p id="music-status">What Are Words · 冯提莫</p></div>
      <button id="launch" type="button"><span class="launch-symbol" aria-hidden="true">✧</span><span id="launch-label">放一场烟花</span></button>
      <p class="gesture-hint" id="gesture-hint">轻点天空，烟花为你升起<span>长按一下，会有更大的一朵</span></p>
    </footer>
    <dialog id="note-dialog" aria-labelledby="note-title">
      <form method="dialog"><button class="note-close" type="submit" aria-label="收好纸条">×</button></form>
      <p class="note-overline">留在这个雪夜的小纸条</p>
      <h2 id="note-title">小颖，</h2>
      <p>听到这首歌的时候，<br>觉得应该配一场雪。</p>
      <p>再添几朵烟花，<br>就刚刚好了。</p>
      <p>你随便点点，<br>今晚的天空归你管。</p>
      <form method="dialog"><button class="keep-note" type="submit">收好，继续看烟花 <span aria-hidden="true">↗</span></button></form>
    </dialog>
    <p id="status" class="sr-only" role="status"></p>
  </main>
  <script type="module">import('./js/app.js?v=20261121-winter1').catch(error=>{console.error(error);document.getElementById('loading').innerHTML='<span>夜色暂时没加载好，刷新一下再试试。</span>';});</script>
</body>
</html>
